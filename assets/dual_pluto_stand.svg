<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922" />
    </marker>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#238636" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  
  <rect width="100%" height="100%" fill="#0d1117" rx="12" />
  <rect x="2" y="2" width="956" height="356" rx="11" fill="none" stroke="#30363d" stroke-width="2" />

  
  <rect x="24" y="18" width="912" height="52" rx="8" fill="url(#headerBg)" stroke="#30363d" stroke-width="1.5" />
  <text x="480" y="42" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">Dual ADALM-Pluto SDR Live Stand (800 MHz BPSK + Gardner CDR)</text>
  <text x="480" y="60" fill="#8b949e" font-size="12" text-anchor="middle">Single Host PC (Linux) | Two Independent USB Contexts | Real-Time Dear ImGui + ImPlot (120 FPS)</text>

  
  <rect x="24" y="90" width="275" height="244" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5" />
  <text x="161" y="114" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">TRANSMITTER (Terminal 1)</text>
  <line x1="42" y1="124" x2="280" y2="124" stroke="#30363d" stroke-width="1" />

  <rect x="44" y="138" width="235" height="58" rx="7" fill="url(#boxBg)" stroke="#30363d" stroke-width="1.5" />
  <text x="161" y="160" fill="#c9d1d9" font-size="13" font-weight="bold" text-anchor="middle">GUI TX Process (./gui)</text>
  <text x="161" y="180" fill="#8b949e" font-size="11" text-anchor="middle">BPSK "Hello Pluto!" | SPS = 10</text>

  <path d="M 161 196 L 161 224" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#arrow-amber)" />
  <text x="222" y="214" fill="#e3b341" font-size="10" text-anchor="middle">SOAPY_SDR_HAS_TIME</text>

  <rect x="44" y="230" width="235" height="86" rx="7" fill="#2d200b" stroke="#d29922" stroke-width="1.5" />
  <text x="161" y="254" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">ADALM-Pluto #1 (TX)</text>
  <text x="161" y="274" fill="#e3b341" font-size="11" text-anchor="middle">URI: usb:1.6.5</text>
  <text x="161" y="294" fill="#8b949e" font-size="11" text-anchor="middle">Fc = 800.000 MHz | Gain = -15 dB</text>

  
  <rect x="330" y="138" width="300" height="178" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="480" y="164" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">RADIO CHANNEL (AIR)</text>
  <text x="480" y="184" fill="#8b949e" font-size="11" text-anchor="middle">800 MHz Carrier | Distance: 20 - 50 cm</text>

  
  <path d="M 358 228 Q 373 196 388 228 T 418 228 T 448 228 T 478 228 T 508 228 T 538 228 T 568 228 T 598 228" fill="none" stroke="#58a6ff" stroke-width="2.5" />
  <line x1="358" y1="228" x2="602" y2="228" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" />

  <text x="480" y="270" fill="#c9d1d9" font-size="11" text-anchor="middle">Cyclic BPSK Packets + Guard Pauses</text>
  <text x="480" y="290" fill="#8b949e" font-size="11" text-anchor="middle">Natural Crystal CFO + Thermal AWGN</text>

  
  <path d="M 279 273 L 322 273" stroke="#d29922" stroke-width="2.2" fill="none" marker-end="url(#arrow-amber)" />
  <path d="M 630 273 L 653 273" stroke="#3fb950" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)" />

  
  <rect x="661" y="90" width="275" height="244" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5" />
  <text x="798" y="114" fill="#7ee787" font-size="14" font-weight="bold" text-anchor="middle">RECEIVER (Terminal 2)</text>
  <line x1="679" y1="124" x2="917" y2="124" stroke="#30363d" stroke-width="1" />

  <rect x="681" y="230" width="235" height="86" rx="7" fill="#0f291a" stroke="#3fb950" stroke-width="1.5" />
  <text x="798" y="254" fill="#f0f6fc" font-size="13" font-weight="bold" text-anchor="middle">ADALM-Pluto #2 (RX)</text>
  <text x="798" y="274" fill="#7ee787" font-size="11" text-anchor="middle">URI: usb:3.6.5</text>
  <text x="798" y="294" fill="#8b949e" font-size="11" text-anchor="middle">Fc = 800.000 MHz | Gain = +35 dB</text>

  <path d="M 798 230 L 798 202" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="855" y="219" fill="#7ee787" font-size="10" text-anchor="middle">Fs = 1 MSPS (CS16)</text>

  <rect x="681" y="138" width="235" height="58" rx="7" fill="url(#boxBg)" stroke="#58a6ff" stroke-width="1.5" />
  <text x="798" y="159" fill="#79c0ff" font-size="13" font-weight="bold" text-anchor="middle">GUI RX + Gardner CDR</text>
  <text x="798" y="179" fill="#8b949e" font-size="11" text-anchor="middle">Matched Filter | Lock Err = 0.026</text>
</svg>
