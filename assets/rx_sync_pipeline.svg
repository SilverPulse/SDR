<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="100%" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d29922" />
    </marker>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="12" />
  <text x="480" y="35" fill="#c9d1d9" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">RX SYNC PIPELINE (GARDNER TED)</text>
  <line x1="300" y1="50" x2="660" y2="50" stroke="#30363d" stroke-width="2" />

  <!-- Block 1: Antenna & IQ Capture -->
  <g transform="translate(40, 90)">
    <rect width="160" height="70" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2" />
    <text x="80" y="30" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">1. RX Stream</text>
    <text x="80" y="50" fill="#8b949e" font-size="12" text-anchor="middle">txdata.pcm (Raw)</text>
  </g>

  <path d="M 200 125 L 260 125" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- Block 2: Matched Filter -->
  <g transform="translate(270, 90)">
    <rect width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#58a6ff" stroke-width="2" />
    <text x="90" y="30" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">2. Matched Filter</text>
    <text x="90" y="50" fill="#8b949e" font-size="12" text-anchor="middle">np.convolve(h = 10)</text>
  </g>

  <path d="M 450 125 L 510 125" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <path d="M 360 160 L 360 225 L 510 225" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="4,4" />

  <!-- Block 3: Phase Decimation -->
  <g transform="translate(520, 90)">
    <rect width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="2" />
    <text x="90" y="30" fill="#c9d1d9" font-size="14" font-weight="bold" text-anchor="middle">3. Phase Decimation</text>
    <text x="90" y="50" fill="#8b949e" font-size="12" text-anchor="middle">offset::SPS (0 to 9)</text>
  </g>

  <path d="M 700 125 L 760 125" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />

  <!-- Block 4: Constellations -->
  <g transform="translate(770, 90)">
    <rect width="150" height="70" rx="8" fill="#238636" fill-opacity="0.15" stroke="#2ea043" stroke-width="2" />
    <text x="75" y="30" fill="#7ee787" font-size="14" font-weight="bold" text-anchor="middle">4. Constellations</text>
    <text x="75" y="50" fill="#7ee787" font-size="12" text-anchor="middle">Concentric Rings</text>
  </g>

  <!-- Block 5: Gardner TED -->
  <g transform="translate(520, 190)">
    <rect width="180" height="70" rx="8" fill="url(#cardGrad)" stroke="#d29922" stroke-width="2" />
    <text x="90" y="30" fill="#d29922" font-size="14" font-weight="bold" text-anchor="middle">5. Gardner TED</text>
    <text x="90" y="50" fill="#8b949e" font-size="11" text-anchor="middle">Re{ (curr - prev)* · mid }</text>
  </g>

  <path d="M 700 225 L 760 225" stroke="#d29922" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" />

  <!-- Block 6: S-Curve Plot -->
  <g transform="translate(770, 190)">
    <rect width="150" height="70" rx="8" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-width="2" />
    <text x="75" y="30" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">6. S-Curve Plot</text>
    <text x="75" y="50" fill="#e3b341" font-size="12" text-anchor="middle">Zero-crossing = Sync</text>
  </g>

  <!-- Corrected Feedback Loop for Timing Error -->
  <path d="M 610 260 L 610 300 L 480 300 L 480 70 L 610 70 L 610 84" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#arrow-green)" stroke-dasharray="6,4" />
  <text x="545" y="62" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Timing Error Feedback (Adjusts Offset)</text>

</svg>
