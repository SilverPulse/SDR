<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12" />
  
  <!-- Decorative Waves -->
  <path d="M 0 140 Q 200 40 400 140 T 800 140" fill="none" stroke="url(#wave1)" stroke-width="3" />
  <path d="M 0 155 Q 200 80 400 155 T 800 155" fill="none" stroke="url(#wave2)" stroke-width="2" />
  
  <!-- Text Elements -->
  <text x="400" y="85" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle">ADALM-Pluto SDR</text>
  <text x="400" y="125" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle">Digital Communication System</text>
  
  <!-- Tech Stack Badges (Decorative) -->
  <g transform="translate(240, 160)">
    <rect x="0" y="0" width="50" height="22" rx="4" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-width="1" />
    <text x="25" y="15" fill="#7ee787" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">C++</text>
    
    <rect x="60" y="0" width="70" height="22" rx="4" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
    <text x="95" y="15" fill="#79c0ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Python 3</text>
    
    <rect x="140" y="0" width="80" height="22" rx="4" fill="#9e6a03" fill-opacity="0.2" stroke="#d29922" stroke-width="1" />
    <text x="180" y="15" fill="#e3b341" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SoapySDR</text>

    <rect x="230" y="0" width="90" height="22" rx="4" fill="#8957e5" fill-opacity="0.2" stroke="#bc8cff" stroke-width="1" />
    <text x="275" y="15" fill="#d2a8ff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BPSK / QPSK</text>
  </g>
</svg>
